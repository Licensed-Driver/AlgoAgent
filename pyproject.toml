[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "single-ticker-rl-trader"
version = "0.1.0"
description = "RL PPO agent for single-ticker trading with Alpaca data, bid/ask spread, and IBKR fees."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "You"}]

[tool.setuptools.packages.find]
where = ["rl_trader"]
